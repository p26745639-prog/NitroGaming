plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offhack.nitrogaming'
    compileSdk 35

    defaultConfig {multiDexEnabled true
                   
        applicationId "com.offhack.nitrogaming"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.startapp:inapp-sdk:5.0.2'
}
